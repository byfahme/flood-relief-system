<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Camp</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="nav">
        <a class="brand" href="/">Flood Relief</a>
        <a href="/camps">Camps</a>
        <a href="/needs">Needs</a>
        <a href="/resources">Resources</a>
        <a href="/resources/add">Add Resource</a>
        <a href="/needs/add">Add Need</a>
        <a href="/reports">Reports</a>
    </div>

    <div class="container">
        <h1>Add Camp</h1>

        <form th:action="@{/camps}" th:object="${camp}" method="post">
            <p>
                <label>Camp name:
                    <input type="text" th:field="*{name}" required>
                </label>
            </p>
            <p>
                <label>Location:
                    <input type="text" th:field="*{location}" required>
                </label>
            </p>
            <button type="submit">Add Camp</button>
            <a href="/camps">Cancel</a>
        </form>
    </div>
</body>
</html>
