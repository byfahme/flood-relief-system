<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Needs and Escalations</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="nav">
        <a class="brand" href="/">Flood Relief</a>
        <a href="/camps">Camps</a>
        <a href="/needs">Needs</a>
        <a href="/resources/add">Add Resource</a>
        <a href="/needs/add">Add Need</a>
        <a href="/reports">Reports</a>
    </div>

    <div class="container">
        <h1>Needs and Escalations</h1>

        <p th:if="${#lists.isEmpty(needs)}">No open or escalated needs.</p>

        <table th:unless="${#lists.isEmpty(needs)}">
            <thead>
                <tr>
                    <th>Camp</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Status</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="n : ${needs}">
                    <td th:text="${n.camp != null ? n.camp.name : '-'}">Camp</td>
                    <td th:text="${n.type}">Type</td>
                    <td th:text="${n.quantity}">0</td>
                    <td>
                        <span th:class="'badge badge-' + ${#strings.toLowerCase(n.status)}" th:text="${n.status}">OPEN</span>
                    </td>
                    <td th:text="${n.createdAt != null ? #temporals.format(n.createdAt, 'dd MMM yyyy HH:mm') : '-'}">Date</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
