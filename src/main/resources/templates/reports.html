<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resource Coordination Reports</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/camps">Camps</a>
        <a href="/needs">Needs</a>
        <a href="/resources/add">Add Resource</a>
        <a href="/needs/add">Add Need</a>
        <a href="/reports">Reports</a>
    </div>

    <h1>Resource Coordination Reports</h1>

    <h2>Camps Overview</h2>
    <table>
        <thead>
            <tr>
                <th>Camp ID</th>
                <th>Camp Name</th>
                <th>Location</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${camps}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">Camp Name</td>
                <td th:text="${c.location}">Location</td>
            </tr>
        </tbody>
    </table>

    <h2>Audit: Resource Log</h2>

    <p th:if="${#lists.isEmpty(logs)}">No resource changes logged yet.</p>

    <table th:unless="${#lists.isEmpty(logs)}">
        <thead>
            <tr>
                <th>Time</th>
                <th>Resource ID</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${logs}">
                <td th:text="${#temporals.format(entry.timestamp, 'dd MMM yyyy HH:mm:ss')}">Time</td>
                <td th:text="${entry.resource.id}">0</td>
                <td th:text="${entry.action}">Action</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
