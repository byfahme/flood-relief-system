<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resource Coordination Reports</title>
</head>
<body>
    <h1>Resource Coordination Reports</h1>

    <p>
        <a href="/">Home</a> | 
        <a href="/camps">Camps</a> | 
        <a href="/reports">Reports</a>
    </p>

    <hr/>

    <h2>Camps Overview</h2>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Camp ID</th>
                <th>Camp Name</th>
                <th>Location</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${camps}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">Camp Name</td>
                <td th:text="${c.location}">Location</td>
            </tr>
        </tbody>
    </table>

    <h2>Resource Log Audit Trail</h2>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Log ID</th>
                <th>Action / Details</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${log.id}">1</td>
                <td th:text="${log}">Log Details</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
