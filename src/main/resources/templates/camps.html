<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camps</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/camps">Camps</a>
        <a href="/needs">Needs</a>
        <a href="/resources/add">Add Resource</a>
        <a href="/needs/add">Add Need</a>
        <a href="/reports">Reports</a>
    </div>

    <h1>Camps</h1>

    <h2>Add a camp</h2>
    <form th:action="@{/camps}" th:object="${camp}" method="post">
        <label>Camp name: <input type="text" th:field="*{name}" required /></label>
        <label>Location: <input type="text" th:field="*{location}" required /></label>
        <button type="submit">Add Camp</button>
    </form>

    <p th:if="${#lists.isEmpty(camps)}">No camps yet. Add a camp first.</p>

    <div th:each="view : ${camps}">
        <h2 th:text="${view.camp.name}"></h2>
        <p>Location: <span th:text="${view.camp.location}"></span></p>

        <h3>Resources</h3>
        <p th:if="${#lists.isEmpty(view.resources)}">No resources logged.</p>
        <table th:unless="${#lists.isEmpty(view.resources)}">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Received</th>
                    <th>Used</th>
                    <th>Available</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${view.resources}">
                    <td th:text="${r.type}"></td>
                    <td th:text="${r.received}"></td>
                    <td th:text="${r.used}"></td>
                    <td th:text="${r.available}"></td>
                </tr>
            </tbody>
        </table>

        <h3>Needs</h3>
        <p th:if="${#lists.isEmpty(view.needs)}">No needs logged.</p>
        <table th:unless="${#lists.isEmpty(view.needs)}">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="n : ${view.needs}">
                    <td th:text="${n.type}"></td>
                    <td th:text="${n.quantity}"></td>
                    <td>
                        <span th:class="'badge badge-' + ${#strings.toLowerCase(n.status)}" th:text="${n.status}"></span>
                    </td>
                </tr>
            </tbody>
        </table>

        <hr>
    </div>

    <p><a href="/reports">View Reports</a></p>
</body>
</html>
